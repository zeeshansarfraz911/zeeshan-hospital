<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal — Zeeshan Hospital</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/business.css">
  <style>
    .sidebar-upgrade { margin: auto 12px 16px; padding: 16px; background: linear-gradient(135deg, #f0fdfa, #ccfbf1); border-radius: var(--radius-sm); border: 1px solid rgba(13,148,136,0.15); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
    .sidebar-upgrade .upgrade-icon { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 4px 12px rgba(13,148,136,0.25); }
    .sidebar-upgrade .upgrade-title { font-size: .85rem; font-weight: 700; color: var(--text); }
    .sidebar-upgrade .upgrade-desc { font-size: .72rem; color: var(--text-light); line-height: 1.4; }
    .sidebar-upgrade .upgrade-btn { width: 100%; justify-content: center; }
    .dash-header-actions { display: flex; align-items: center; gap: 8px; }
    .notif-bell { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: none; background: var(--bg); cursor: pointer; font-size: 1.15rem; color: var(--text-light); transition: all var(--transition); }
    .notif-bell:hover { background: var(--primary-bg); color: var(--primary); transform: translateY(-1px); }
    .notif-bell .bell-icon { line-height: 1; }
    .notif-bell .notif-count { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--danger); color: #fff; font-size: .6rem; font-weight: 700; border-radius: 9px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(239,68,68,0.3); }
    .notif-panel { position: fixed; top: 0; right: -400px; width: 380px; max-width: 100vw; height: 100vh; background: #fff; box-shadow: -8px 0 40px rgba(0,0,0,0.1); z-index: 5000; transition: right .35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .notif-panel.open { right: 0; }
    .notif-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .notif-panel-header h4 { font-size: 1.05rem; }
    .notif-panel-actions { display: flex; align-items: center; gap: 8px; }
    .notif-mark-read { font-size: .78rem; color: var(--primary); background: none; border: none; cursor: pointer; font-weight: 600; padding: 4px 8px; border-radius: 4px; transition: all .2s; }
    .notif-mark-read:hover { background: var(--primary-bg); }
    .notif-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; color: var(--text-light); transition: all .2s; }
    .notif-close:hover { background: #fee2e2; color: var(--danger); }
    .notif-panel-body { flex: 1; overflow-y: auto; padding: 8px 16px; }
    .notif-item { display: flex; gap: 12px; padding: 14px 12px; border-radius: var(--radius-sm); transition: background .2s; cursor: pointer; border-bottom: 1px solid var(--border-light); }
    .notif-item:hover { background: var(--primary-bg); }
    .notif-item.unread { background: #f0fdfa; border-left: 3px solid var(--primary); }
    .notif-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .notif-message { font-size: .78rem; color: var(--text-light); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .notif-time { font-size: .68rem; color: var(--text-lighter); margin-top: 4px; }
    .notif-empty { text-align: center; padding: 60px 20px; color: var(--text-lighter); }
    .notif-empty .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .5; }
    .spec-select { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .spec-select button { padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: #fff; cursor: pointer; font-size: .85rem; transition: all .2s; font-weight: 500; color: var(--text-secondary); }
    .spec-select button:hover, .spec-select button.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); font-weight: 600; box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
    .tab-bar { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: var(--radius-sm); margin-bottom: 24px; flex-wrap: wrap; }
    .tab-bar button { padding: 8px 20px; border: none; border-radius: 6px; background: transparent; cursor: pointer; font-size: .85rem; font-weight: 500; color: var(--text-light); transition: all .2s; }
    .tab-bar button.active { background: #fff; color: var(--primary); box-shadow: var(--shadow); }
    .section-title-sm { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .home-collection-badge { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
    .prescription-actions { display: flex; gap: 8px; }
    .nav-logout { color: var(--danger) !important; margin-top: auto; border-top: 1px solid var(--border-light); padding-top: 12px !important; margin-top: 8px !important; }
    .nav-logout:hover { background: #fef2f2 !important; color: var(--danger) !important; }
    .sidebar-nav { display: flex; flex-direction: column; height: 100%; }
    @media (max-width: 768px) { .notif-panel { width: 100vw; } .sidebar-nav { height: auto; } }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="dash-sidebar" id="sidebar">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">P</div>
        <div class="sidebar-user-info">
          <h4 id="sidebarName">Patient</h4>
          <p id="sidebarEmail">patient@zh.com</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active" data-tab="dashboard"><span class="nav-icon">&#9632;</span> Dashboard</a>
        <a href="#" data-tab="doctors"><span class="nav-icon">&#9881;</span> Find Doctors</a>
        <a href="#" data-tab="appointments"><span class="nav-icon">&#128197;</span> My Appointments</a>
        <a href="#" data-tab="prescriptions"><span class="nav-icon">&#9998;</span> Prescriptions</a>
        <a href="#" data-tab="lab"><span class="nav-icon">&#9776;</span> Lab Tests</a>
        <a href="#" data-tab="records"><span class="nav-icon">&#128196;</span> Medical Records</a>
        <a href="#" data-tab="pharmacy"><span class="nav-icon">&#9766;</span> Order Medicine</a>
        <a href="#" data-tab="profile"><span class="nav-icon">&#9787;</span> My Profile</a>
        <a href="#" onclick="logout()" class="nav-logout"><span class="nav-icon">&#8617;</span> Logout</a>
      </nav>
      <div class="sidebar-upgrade">
        <div class="upgrade-icon">&#9733;</div>
        <div>
          <div class="upgrade-title">Free Plan</div>
          <div class="upgrade-desc">Unlock priority appointments &amp; more</div>
        </div>
        <a href="#" class="btn btn-primary btn-sm upgrade-btn">Upgrade to Pro</a>
      </div>
    </aside>
    <main class="dash-main">
      <div class="dash-header">
        <div class="dash-header-left">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">Welcome back! Manage your healthcare</p>
        </div>
        <div class="dash-header-actions">
          <div class="notif-bell" onclick="toggleNotifications()">
            <span class="bell-icon">&#128276;</span>
            <span class="notif-count" id="notifCount">0</span>
          </div>
          <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <div id="pageContent"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-panel-header">
      <h4>Notifications</h4>
      <div class="notif-panel-actions">
        <button class="notif-mark-read" onclick="markAllNotifRead()">Mark all read</button>
        <button class="notif-close" onclick="closeNotifications()">&times;</button>
      </div>
    </div>
    <div class="notif-panel-body" id="notifList"></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/patient.js"></script>
  <script>
    function toggleNotifications(){var e=document.getElementById('notifPanel');e.classList.toggle('open'),e.classList.contains('open')&&renderNotifications()}function closeNotifications(){document.getElementById('notifPanel').classList.remove('open')}function renderNotifications(){var e=document.getElementById('notifList'),t=getNotifications((getCurrentUser()||{}).id)||[];e.innerHTML=t.length?'<div style="padding:4px 0">'+t.map(function(n){return'<div class="notif-item'+(n.read?'':' unread')+'" onclick="markNotifRead(\''+n.id+'\')"><div class="notif-icon" style="background:'+(n.type==='success'?'#d1fae5;color:#059669':n.type==='error'?'#fee2e2;color:#dc2626':'#dbeafe;color:#2563eb')+'">'+(n.type==='success'?'&#10003;':n.type==='error'?'&#10007;':'&#8505;')+'</div><div class="notif-body"><div class="notif-title">'+n.title+'</div><div class="notif-message">'+n.message+'</div><div class="notif-time">'+formatRelativeDate(n.createdAt)+'</div></div></div>';}).join('')+'</div>':'<div class="notif-empty"><div class="empty-icon">&#128276;</div><p>No notifications yet</p></div>';var n=getUnreadNotificationCount((getCurrentUser()||{}).id)||0;var r=document.getElementById('notifCount');r&&(r.textContent=n>99?'99+':n)}function markNotifRead(e){markNotificationRead(e),renderNotifications()}function markAllNotifRead(){markAllNotificationsRead((getCurrentUser()||{}).id),renderNotifications(),showToast('All notifications marked as read','success')}document.addEventListener('DOMContentLoaded',async function(){if(window.dbPromise)await window.dbPromise;initPatient();var e=document.getElementById('notifCount');if(e){var t=getUnreadNotificationCount((getCurrentUser()||{}).id)||0;e.textContent=t>99?'99+':t}});
  </script>
</body>
</html>
