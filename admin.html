<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Zeeshan Hospital</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/business.css">
  <style>
    .admin-stat-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: all var(--transition); }
    .admin-stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .admin-stat-card .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 12px; }
    .admin-stat-card .stat-label { font-size: .8rem; color: var(--text-light); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .admin-stat-card .stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
    .admin-stat-card .stat-sub { font-size: .78rem; color: var(--text-lighter); margin-top: 4px; }
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .admin-section { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px; }
    .admin-section h3 { font-size: 1.05rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .admin-section h3 .count-badge { margin-left: auto; font-size: .75rem; background: var(--primary-bg); color: var(--primary); padding: 2px 10px; border-radius: var(--radius-full); font-weight: 600; }
    .admin-section .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .admin-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .admin-filter-bar select, .admin-filter-bar input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: .85rem; background: #fff; }
    .admin-filter-bar select:focus, .admin-filter-bar input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
    .activity-list { display: flex; flex-direction: column; }
    .activity-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .activity-item:last-child { border-bottom: none; }
    .activity-item .act-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
    .activity-item .act-content { flex: 1; min-width: 0; }
    .activity-item .act-title { font-size: .88rem; font-weight: 600; color: var(--text); }
    .activity-item .act-desc { font-size: .8rem; color: var(--text-light); }
    .activity-item .act-time { font-size: .75rem; color: var(--text-lighter); white-space: nowrap; }
    .view-btn { padding: 4px 12px; font-size: .78rem; border: 1px solid var(--primary); border-radius: var(--radius-sm); background: transparent; color: var(--primary); cursor: pointer; transition: all .2s; font-weight: 500; }
    .view-btn:hover { background: var(--primary); color: #fff; }
    .low-stock-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm); margin-bottom: 6px; }
    .low-stock-item .ls-name { flex: 1; font-weight: 600; font-size: .85rem; }
    .low-stock-item .ls-stock { color: var(--danger); font-weight: 600; font-size: .85rem; }
    .db-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .db-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .db-info-card { background: var(--bg); border-radius: var(--radius-sm); padding: 16px; border: 1px solid var(--border); }
    .db-info-card .db-label { font-size: .75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 4px; }
    .db-info-card .db-value { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .demo-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .demo-table th, .demo-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border-light); }
    .demo-table th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-light); font-weight: 600; background: #f8fafc; }
    .demo-table tr:hover td { background: #fafafa; }
    .patient-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .patient-modal-grid .pm-item label { font-size: .75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; display: block; margin-bottom: 2px; }
    .patient-modal-grid .pm-item span { font-size: .9rem; color: var(--text); font-weight: 500; }
    .dash-header-actions { display: flex; align-items: center; gap: 8px; }
    .notif-bell { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: none; background: var(--bg); cursor: pointer; font-size: 1.15rem; color: var(--text-light); transition: all var(--transition); }
    .notif-bell:hover { background: var(--primary-bg); color: var(--primary); transform: translateY(-1px); }
    .notif-bell .bell-icon { line-height: 1; }
    .notif-bell .notif-count { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--danger); color: #fff; font-size: .6rem; font-weight: 700; border-radius: 9px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(239,68,68,0.3); }
    .notif-panel { position: fixed; top: 0; right: -400px; width: 380px; max-width: 100vw; height: 100vh; background: #fff; box-shadow: -8px 0 40px rgba(0,0,0,0.1); z-index: 5000; transition: right .35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .notif-panel.open { right: 0; }
    .notif-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .notif-panel-header h4 { font-size: 1.05rem; }
    .notif-panel-actions { display: flex; align-items: center; gap: 8px; }
    .notif-mark-read { font-size: .78rem; color: var(--primary); background: none; border: none; cursor: pointer; font-weight: 600; padding: 4px 8px; border-radius: 4px; transition: all .2s; }
    .notif-mark-read:hover { background: var(--primary-bg); }
    .notif-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; color: var(--text-light); transition: all .2s; }
    .notif-close:hover { background: #fee2e2; color: var(--danger); }
    .notif-panel-body { flex: 1; overflow-y: auto; padding: 8px 16px; }
    .notif-item { display: flex; gap: 12px; padding: 14px 12px; border-radius: var(--radius-sm); transition: background .2s; cursor: pointer; border-bottom: 1px solid var(--border-light); }
    .notif-item:hover { background: var(--primary-bg); }
    .notif-item.unread { background: #f0fdfa; border-left: 3px solid var(--primary); }
    .notif-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .notif-message { font-size: .78rem; color: var(--text-light); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .notif-time { font-size: .68rem; color: var(--text-lighter); margin-top: 4px; }
    .notif-empty { text-align: center; padding: 60px 20px; color: var(--text-lighter); }
    .notif-empty .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .5; }
    .nav-logout { color: var(--danger) !important; margin-top: auto; border-top: 1px solid var(--border-light); padding-top: 12px !important; margin-top: 8px !important; }
    .nav-logout:hover { background: #fef2f2 !important; color: var(--danger) !important; }
    .sidebar-nav { display: flex; flex-direction: column; height: 100%; }
    @media (max-width: 768px) { .patient-modal-grid { grid-template-columns: 1fr; } .admin-stats { grid-template-columns: repeat(2,1fr); } .notif-panel { width: 100vw; } .sidebar-nav { height: auto; } }
    @media (max-width: 480px) { .admin-stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="dash-sidebar" id="sidebar">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info">
          <h4 id="sidebarName">System Admin</h4>
          <p id="sidebarEmail">admin@zh.com</p>
        </div>
      </div>
      <nav class="sidebar-nav" id="adminNav">
        <a href="#" class="active" data-tab="dashboard"><span class="nav-icon">&#9632;</span> Dashboard</a>
        <a href="#" data-tab="patients"><span class="nav-icon">&#9787;</span> Patients</a>
        <a href="#" data-tab="doctors"><span class="nav-icon">&#9881;</span> Doctors</a>
        <a href="#" data-tab="appointments"><span class="nav-icon">&#128197;</span> Appointments</a>
        <a href="#" data-tab="pharmacy"><span class="nav-icon">&#9766;</span> Pharmacy</a>
        <a href="#" data-tab="lab"><span class="nav-icon">&#9776;</span> Lab</a>
        <a href="#" data-tab="messages"><span class="nav-icon">&#9993;</span> Messages</a>
        <a href="#" data-tab="system"><span class="nav-icon">&#9881;</span> System</a>
        <a href="#" onclick="logout()" class="nav-logout"><span class="nav-icon">&#8617;</span> Logout</a>
      </nav>
    </aside>
    <main class="dash-main">
      <div class="dash-header">
        <div class="dash-header-left">
          <h2 id="pageTitle">Admin Dashboard</h2>
          <p id="pageSubtitle">System Overview</p>
        </div>
        <div class="dash-header-actions">
          <div class="notif-bell" onclick="toggleNotifications()">
            <span class="bell-icon">&#128276;</span>
            <span class="notif-count" id="notifCount">0</span>
          </div>
          <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <div id="pageContent"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-panel-header">
      <h4>Notifications</h4>
      <div class="notif-panel-actions">
        <button class="notif-mark-read" onclick="markAllNotifRead()">Mark all read</button>
        <button class="notif-close" onclick="closeNotifications()">&times;</button>
      </div>
    </div>
    <div class="notif-panel-body" id="notifList"></div>
  </div>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
  <script>
    function toggleNotifications(){var e=document.getElementById('notifPanel');e.classList.toggle('open'),e.classList.contains('open')&&renderNotifications()}function closeNotifications(){document.getElementById('notifPanel').classList.remove('open')}function renderNotifications(){var e=document.getElementById('notifList'),t=getNotifications((getCurrentUser()||{}).id)||[];e.innerHTML=t.length?'<div style="padding:4px 0">'+t.map(function(n){return'<div class="notif-item'+(n.read?'':' unread')+'" onclick="markNotifRead(\''+n.id+'\')"><div class="notif-icon" style="background:'+(n.type==='success'?'#d1fae5;color:#059669':n.type==='error'?'#fee2e2;color:#dc2626':'#dbeafe;color:#2563eb')+'">'+(n.type==='success'?'&#10003;':n.type==='error'?'&#10007;':'&#8505;')+'</div><div class="notif-body"><div class="notif-title">'+n.title+'</div><div class="notif-message">'+n.message+'</div><div class="notif-time">'+formatRelativeDate(n.createdAt)+'</div></div></div>';}).join('')+'</div>':'<div class="notif-empty"><div class="empty-icon">&#128276;</div><p>No notifications yet</p></div>';var n=getUnreadNotificationCount((getCurrentUser()||{}).id)||0;var r=document.getElementById('notifCount');r&&(r.textContent=n>99?'99+':n)}function markNotifRead(e){markNotificationRead(e),renderNotifications()}function markAllNotifRead(){markAllNotificationsRead((getCurrentUser()||{}).id),renderNotifications(),showToast('All notifications marked as read','success')}document.addEventListener('DOMContentLoaded',async function(){if(window.dbPromise)await window.dbPromise;initAdmin();var e=document.getElementById('notifCount');if(e){var t=getUnreadNotificationCount((getCurrentUser()||{}).id)||0;e.textContent=t>99?'99+':t}});
  </script>
</body>
</html>
